name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      SESSION_SECRET: ci-only-session-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: apps/api/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check application import
        run: uv run python -c "from app.main import app; assert app.title == 'BugLens API'"

      - name: Validate GCP deployment scripts
        run: bash -n ../../ops/gcp/*.sh

  api-container:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build API production image
        run: docker build -t buglens-api:ci apps/api

      - name: Verify non-root runtime user
        run: |
          docker run --rm \
            --entrypoint sh \
            buglens-api:ci \
            -c 'test "$(id -u)" = "10001"'

      - name: Launch Playwright Chromium as non-root
        run: |
          docker run --rm \
            --entrypoint python \
            buglens-api:ci \
            -c '
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              print(browser.version)
              browser.close()
          '

      - name: Start API container on Cloud Run port
        run: |
          docker run -d \
            --name buglens-api-ci \
            -e PORT=8091 \
            -e SESSION_SECRET=ci-only-session-secret \
            -p 127.0.0.1:8091:8091 \
            buglens-api:ci

      - name: Wait for API health
        run: |
          for _ in {1..20}; do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:8091/health)"; then
              if [ "$response" = '{"status":"ok"}' ]; then
                exit 0
              fi
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' buglens-api-ci)" != "true" ]; then
              docker logs buglens-api-ci || true
              exit 1
            fi

            sleep 1
          done

          docker logs buglens-api-ci || true
          exit 1

      - name: Remove API container
        if: always()
        run: docker rm -f buglens-api-ci >/dev/null 2>&1 || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
