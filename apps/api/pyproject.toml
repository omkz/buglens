[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.141.1",
    "google-adk>=2.7.0",
    "google-cloud-storage>=3.13.1",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
